[window]
padding = { x = 10, y = 10 }
opacity = 0.9
decorations = "Full"
startup_mode = "Windowed"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 14

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[cursor]
style = { shape = "Block", blinking = "On" }

[selection]
save_to_clipboard = true

